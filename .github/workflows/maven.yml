name: Java CI integrationTests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:

    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [17,21]


    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: customerdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{matrix.java}}
        distribution: 'temurin'
        cache: maven


    - name: starta hela systemet med docker
      run: docker compose up -d --build

    - name: vänta på att allt ska startas
      run: sleep 20

    - name: anrop mot ett av våra endpoints
      run: curl -f http://localhost:8080/customer/1

    - name: tear everything down
      if: always()
      run: docker compose down -v



    - name: Build with Maven
      run: mvn test

    - name: Build with Maven
      run: mvn -B package -DskipTests


      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/customerdb
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: root

